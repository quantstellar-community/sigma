[project]
name = "sigma"
version = "0.1.0"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "arch>=8.0.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas>=2.2,<3",
    "plotly>=6.9.0",
    "pydantic-settings>=2.15.0",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.49.0",
    "quantlib>=1.43",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "statsmodels>=0.14.6",
    "taipy>=4.1.1",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
